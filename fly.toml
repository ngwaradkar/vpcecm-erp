# fly.toml configuration for VPCCECM ERP

app = 'vpcecm-erp'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_NAME = 'VPCCECM'
  APP_ENV = 'production'
  APP_DEBUG = 'false'
  DB_CONNECTION = 'sqlite'
  DB_DATABASE = '/var/www/html/database/database.sqlite'
  LOG_CHANNEL = 'stderr'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
