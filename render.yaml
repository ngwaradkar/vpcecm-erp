services:
  - type: web
    name: vpcecm-erp
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: VPCCECM
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: APP_KEY
        generateValue: true
